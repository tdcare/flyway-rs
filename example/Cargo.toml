[package]
name = "example"
version = "0.3.2"
authors = ["tdcare <tzw@tdcare.cn>"]
edition = "2021"
publish = false

[dependencies]
#serde and base types
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

log = "0.4.17"
fast_log = "1.5"

flyway= {workspace = true}
flyway-rbatis= {workspace = true}

rbatis = {version="4.9",features = ["debug_mode"]} #必选
rbdc-mysql = "4.9"
rbdc-pg = "4.9"
rbdc-tdengine = "4.9"

[[bin]]
name = "mysql"
path = "src/mysql.rs"
[[bin]]
name = "taos"
path = "src/taos.rs"
[[bin]]
name = "multi-db"
path = "src/multi_db.rs"

